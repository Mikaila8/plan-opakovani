<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plán opakování</title>
<style>
  :root {
    --bg: #f3f4f8; --karta: #ffffff; --text: #232a3d; --slaby: #737b8c;
    --akcent: #2f4a82; --hotovo: #2fa37a; --cara: #e3e6ee; --tyden: #2f4a82; --tyden-svetla: #e6e9f2;
    --hlava: linear-gradient(100deg, #1a2f5c 0%, #2b4c8c 55%, #15244a 100%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .pozdrav { font-size: 14px; color: var(--slaby); margin: 0; }
  h1 { font-size: 26px; margin: 2px 0 2px; letter-spacing: -.01em; }
  .podtitul { color: var(--slaby); font-size: 14px; margin: 0 0 14px; }
  .odkazy { display: flex; gap: 8px; margin: 0 0 14px; }
  .odkazy:empty { display: none; }
  .odkazy a { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
              text-decoration: none; padding: 9px 2px 8px; border-radius: 14px; background: var(--karta);
              color: var(--text); font-weight: 700; font-size: 13px; white-space: nowrap;
              box-shadow: 0 1px 3px rgba(30,50,60,.12); }
  .odkazy a b { font-size: 20px; line-height: 1.1; }
  .tydny { display: flex; gap: 6px; margin-bottom: 12px; }
  .tydny button { flex: 1; padding: 9px 0 7px; border: 0; border-radius: 14px; font: inherit;
                  font-weight: 700; font-size: 14px; cursor: pointer; color: var(--text); background: #e6e8ee; }
  .tydny button.vybrany { background: var(--tyden); border-color: var(--tyden); color: #fff;
                          box-shadow: 0 3px 8px rgba(30,50,60,.18); }
  .tydny button small { display: block; font-weight: 500; font-size: 11px; opacity: .95; }
  .cesta { padding: 2px 4px 0; margin-bottom: 14px; }
  .cesta-hlava { display: flex; justify-content: space-between; font-size: 12px; color: var(--slaby); margin-bottom: 6px; }
  .cesta-hlava b { color: var(--text); }
  .zastavky { position: relative; display: flex; justify-content: space-between; }
  .zastavky::before { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 2px;
                      background: #d3dde3; border-radius: 1px; }
  .zastavky .ujeto { position: absolute; left: 7px; top: 6px; height: 2px; border-radius: 1px;
                     background: var(--tyden); transition: width .4s; }
  .zastavka { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
              color: var(--slaby); width: 14px; }
  .zastavka i { font-style: normal; width: 14px; height: 14px; border-radius: 50%; display: block;
                background: var(--bg); border: 2px solid #c9d4da; }
  .zastavka span { font-size: 10px; line-height: 1.2; }
  .zastavka.hotova i { background: var(--tyden); border-color: var(--tyden); }
  .zastavka.dnes i { border-color: var(--akcent); background: var(--karta); }
  .zastavka.dnes { color: var(--akcent); font-weight: 700; }
  .zastavka.zvolno i { background: #f4b942; border-color: #f4b942; }
  .zastavka.zvolno { color: #9a6b00; }
  .karta-dne { background: var(--karta); border-radius: 18px; margin-bottom: 14px; overflow: hidden;
               box-shadow: 0 1px 3px rgba(30,50,60,.10); }
  .karta-dne { border: 1.5px solid #c9d5ec; }
  .karta-dne.dnes { border-color: var(--tyden); box-shadow: 0 4px 14px rgba(47,74,130,.2); }
  .hlava-dne { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
               font-weight: 800; font-size: 17px; background: var(--hlava); color: #fff; }
  .hlava-dne .stitek { font-size: 12px; font-weight: 700; background: #f4b942; color: #5a3d00;
                       border-radius: 999px; padding: 3px 10px; }
  .hlava-dne .hotovo-dne { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
  .ukol { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none;
          padding: 12px 14px; border: 0; border-top: 1px solid var(--cara); font: inherit; color: var(--text); cursor: pointer; }
  .ukol .ikona { flex: none; font-size: 26px; width: 44px; height: 44px; border-radius: 12px;                  background: #eef2fa; display: flex; align-items: center; justify-content: center; }   .ukol.hotovo .ikona { background: #e3f1e6; }
  .ukol .text { flex: 1; min-width: 0; }
  .ukol .kdy { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px;
               margin-bottom: 2px; background: #eef1f3; color: var(--slaby); text-transform: uppercase; letter-spacing: .04em; }
  .ukol .kdy.rano { background: #fdeab3; color: #8a5a00; }
  .ukol .kdy.vecer { background: #e4e6f2; color: #474e78; }
  .ukol .nazev { font-weight: 600; }
  .ukol .cas { flex: none; font-size: 13px; color: var(--slaby); }
  .ukol .policko { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c5d0d6;
                   display: grid; place-items: center; font-size: 17px; color: #fff; }
  .ukol.hotovo .nazev { color: var(--slaby); }
  .ukol.hotovo .policko { background: var(--hotovo); border-color: var(--hotovo); animation: fajfka .35s ease-out; }
  .ukol.hotovo .policko::after { content: "✓"; }
  @keyframes fajfka { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .otevrit { display: block; text-align: right; text-decoration: none; font-size: 13px; font-weight: 700;
             color: var(--text); padding: 0 14px 10px; margin-top: -4px; }
  .volno { padding: 14px; color: var(--slaby); font-size: 15px; border-top: 1px solid var(--cara); }
  .zprava { padding: 12px 14px; border-radius: 12px; background: #fdecec; color: #8a2525;
            font-size: 14px; margin-bottom: 12px; display: none; }
  .nacitani { color: var(--slaby); padding: 24px 0; text-align: center; }
  .tip { font-size: 13px; color: var(--slaby); margin-top: 6px; text-align: center; }
  #platno { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .pop { position: fixed; z-index: 60; pointer-events: none; font-size: 44px; transform: translate(-50%, -50%);
         animation: pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.3); }
                   25% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); }
                   100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
  .banner { position: fixed; left: 50%; top: 38%; z-index: 61; pointer-events: none; transform: translate(-50%, -50%);
            background: var(--karta); border-radius: 16px; padding: 16px 22px; font-size: 20px; font-weight: 700;
            box-shadow: 0 8px 30px rgba(0,0,0,.18); text-align: center; animation: banner 2.4s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.8); }
                      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
                      80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -55%); } }
  .zahlavi { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .serie { flex: none; background: var(--karta); border: 1.5px solid #f4b942; border-radius: 14px; padding: 6px 10px;
           text-align: center; color: #9a6b00; line-height: 1.15; }
  .serie b { display: block; font-size: 18px; font-weight: 800; }
  .serie b::before { content: "🔥 "; font-size: 15px; }
  .serie span { font-size: 11px; font-weight: 600; }

  /* ---------- Dechová kotva (cvičení před plánem) ---------- */
  /* Ma Shan Zheng (Google Fonts, licence OFL), jen znaky 吸 a 呼 */
  @font-face { font-family:'MSZ XiHu'; src:url(data:font/woff2;base64,d09GMgABAAAAAAWQAA4AAAAACXAAAAU9AAIAxQAAAAAAAAAAAAAAAAAAAAAAAAAAGyAcIAZgADwRCAqKDIdQATYCJAMICwgABCAFg14HIAwHGzoHUZRMUpjiq4MyxvA1rMNYxyZJEgxpdh+JW19ff21Deicenj/8nfvu+/83xqKJ0cQsoDZGXhpooNPjAh0L0/YAnpoKk8mDaAIQrgYgbMABc1o64YfTVWyxl4S95A+1plDYH/KNAUvtXRL4NafrYP4vx5/uHd07wMl0Ims29qRtbYwwsLWwbVnAifU8UM02GyYkC6SxcGsdYhJ79/MEOkyhB9pS1zUFkCr84wDodM27KAQalBOwJQDYNrPFISAcgkBF2pxnd0dNBVg0lTSNhQTiMgH5HmGpR4iv8hNzwJwg1SHRQ1CoRdD0hxKTxOGg5Fs96cqVLvGP0wtzzk20iBtAPKzhAnusrhM3428yEuHQYdZWBXi9j0anKRkxylL76hrgem7zvGMdGQEi3wxJqUIefYtL5Y/jT2OCqS7Ns+J6BjHo3pxz157pqCCXqgBr2zqgmTURlnXma8FRtud1sxtQju0mSOB97zuXuU1vl7tEWppx0E6uA36bKijx1LdnC6X4K7eUgPO6tq1BO5lvcinu2j5q6kKlWy+Xqljj7SN/wxhj4yvRnZ4ixXSPWoovSS6hscsXy8r1ieXwzomm5T447mYrMO2xnYrGRx6qnunhIottzGcQ8N90F5BRdcMiZ8qYbeQ2vY531ozZGaXTK3u/XiqVbz76IJdWduNCKCoftasWrHMASp3L8l2hZG7zHdCoNR2GFa9toG4t+av46r7svVDZDWLNAmrQASS2z6f8VnsrRwgQNGqjazX4mae+o8nyc8BzwJWFpsGhrp7q7ZmeHuvh0X98v3D9Pdzayht7e/4urOCNoYE5jdmivB5t938YtBcGZwMxGpI2h1tJI9SzXZuDxRLUI6j5PNWVXHQ+aNu6axKZiMrIySNQqJnLJ8RjaBFMUdS5CMGMFIA4JoXpsEo5We4Fqa+qkf8qLmFYDsXhF41o7XMvc7iWLUZpPEiCSj3dmTRiR0PQOs+UdbK3RVjyqPignNlUGLdgIfUmMOj9HUZbEgz+93neSgRHBqZ3PAklpNaWyBPN9IxQErOYasM4/f9DS1rGNoxpkjqikgjWRqgi1qNKoEsBVXQmhWhWitR4N5iYSJJK9tYruQY44rsophQTDA0vEoQoTBFWsBpjEUJDr4bfUBE5o9C8M8DZqhUUqulBLll6JOS3U6rpwWLahdib7Yw7s1GbhkFTRMSIRBwJXh8BbOek+AZIq2gf5FmquoANIbkKKDWuGq9Ioul/opoohIQEOkrDmIX1lHsdXxXiBnJL+qxCPPbCWZkSigzjgqU2DbO4meDjLzagzUi4qiutMzGhm58FPmygN5DrTWbJe6kuBOf4GzW7pAUJcuNyHu7Cjgst7PrSk0/qIWdRgb2ZCqyCTExc6JIjZSZ16NEjFkI2YZSGJsfPkDIgIFTkWkhfQwhCYCrXUw/DWud/IITAVpMQsIY8AECguF1fa7NzIJD91gaBvIQ779EdAK/pozQ4wv+n+S5LAJqKV/pvGATGmU95qaox/lLG8AIhCyNAyAdMID3Z37JruyoK4AKhwoRxquhxT6VN91S1HNRUw0SoPt40H/aAigCBogTz4sFTKEbCBAmRJNV0DNxyepyYbAUn/qz1uD8PjAwFC+DNjYs/pyRMKIQFCBaic8YeCxUohDQBAjx4aS6MM35vIIDfzBcggDFfbtxz/kKFaMmPk5B0KFrn+pSFUUYZRTU2OQ9hfOfzgwnjJ0iQCBkwZ0WNiu1hpQl8Ab0mTWKUgDm3pQNeAnA5exB5DohK918LrKi/ClzaIDQPAAA=) format('woff2'); font-display:block; }
  #dech { position: fixed; inset: 0; z-index: 100; overflow: hidden; color: #1f2440;
          background: radial-gradient(70% 45% at 50% 38%, var(--bgStred, #fffaf5) 0%, var(--bgOkraj, #fef3e8) 100%);
          transition: opacity .6s; }
  #dech.skryty { opacity: 0; pointer-events: none; }
  #dech[hidden] { display: none; }
  #dVlny { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 52vh; }
  #dech .d-scena { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center;
                   justify-content: center; padding-bottom: 16vh; }
  #dKolo { width: min(78vw, 420px); height: min(78vw, 420px); }
  #dech .d-ovladani { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 2; }
  #dech .d-ovladani button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.55);
          cursor: pointer; display: grid; place-items: center; color: #3a3f5c; padding: 0; }
  #dech .d-ovladani svg { width: 22px; height: 22px; }
  #dech .d-panel { position: absolute; top: 66px; right: 14px; width: 270px; background: #fff; border-radius: 14px;
          padding: 14px 16px; box-shadow: 0 10px 30px rgba(40,40,90,.18); font-size: 14px; display: none; z-index: 3; }
  #dech .d-panel.ukaz { display: block; }
  #dech .d-panel label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  #dech .d-panel small { display: block; color: #6b7090; margin-top: 8px; }
  #dech .d-delka { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eceef6; }
  #dech .d-krok { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #dech .d-krok button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #d9dcec; background: #fff;
          font-size: 22px; cursor: pointer; color: #3a3f5c; }
  #dech .d-krok b { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #dech .d-cip { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 14px;
          padding: 10px 18px; border: 0; border-radius: 999px; background: rgba(255,255,255,.85); color: #3a3f5c;
          cursor: pointer; z-index: 2; }
  #dech .d-cip[hidden] { display: none; }
</style>
</head>
<body>
<div id="dech" hidden aria-label="Dechové cvičení">
  <canvas id="dVlny" aria-hidden="true"></canvas>
  <div class="d-scena"><canvas id="dKolo" width="840" height="840" aria-hidden="true"></canvas></div>
  <div class="d-ovladani">
    <button id="dZnovu" title="Pustit znovu" aria-label="Pustit znovu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button id="dZvuk" title="Ztlumit zvuk" aria-label="Ztlumit zvuk"></button>
    <button id="dNast" title="Nastavení" aria-label="Nastavení">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="dZavrit" title="Přeskočit cvičení" aria-label="Přeskočit cvičení">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="d-panel" id="dPanel">
    <label><input type="checkbox" id="dZapnuto" checked> <span>Dechové cvičení při otevření stránky<br><small>(poprvé dopoledne a poprvé odpoledne)</small></span></label>
    <div class="d-delka">
      <span>Délka dechu</span>
      <div class="d-krok"><button id="dKratsi" aria-label="Kratší dech">−</button><b id="dDelkaText">0 s</b><button id="dDelsi" aria-label="Delší dech">+</button></div>
      <small id="dDelkaPopis"></small>
    </div>
  </div>
  <button class="d-cip" id="dCip" hidden>Klepni pro zapnutí zvuku</button>
  <audio id="dAudio" src="dech.mp3" preload="auto"></audio>
</div>
<main>
  <canvas id="platno"></canvas>
  <div class="zahlavi">
    <div><p class="pozdrav" id="pozdrav"></p>
    <h1>Plán opakování</h1></div>
    <div class="serie" id="serie" style="display:none"><b id="serieCislo">0</b><span id="serieText">dny v řadě</span></div>
  </div>
  <p class="podtitul">Ťukni na úkol, když ho máš hotový.</p>
  <div class="zprava" id="zprava"></div>
  <div class="tydny" id="tydny"></div>
  <div class="odkazy" id="odkazy"></div>
  <div class="cesta" id="cesta" style="display:none"></div>
  <div id="seznam"><div class="nacitani">Načítám…</div></div>
  <p class="tip" id="dokChyba" style="display:none"></p>
  <p class="tip">Nestihneš-li někdy všechno, udělej aspoň Anki.</p>
</main>

<script>
  var stav = null;
  var tyden = null;
  var KLIC = 'planOpakovani.tyden';

  function ulozTyden(t) { try { localStorage.setItem(KLIC, String(t)); } catch (e) {} }
  function nactiTyden() { try { var v = localStorage.getItem(KLIC); return v === null ? null : Number(v); } catch (e) { return null; } }

  function ukaz(text) {
    var z = document.getElementById('zprava');
    z.textContent = text; z.style.display = text ? 'block' : 'none';
  }

  function ukoly() { return stav.radky.filter(function (r) { return !r.volno; }); }

  function hotovoVTydnu(t) {
    return ukoly().filter(function (r) { return r.hotovo[t]; }).length;
  }

  function vychoziTyden() {
    if (stav.tyden !== null && stav.tyden !== undefined) return stav.tyden;   // podle data z tabulky
    var ulozeny = nactiTyden();
    if (ulozeny !== null && ulozeny >= 0 && ulozeny < stav.tydny) return ulozeny;
    for (var t = 0; t < stav.tydny; t++) if (hotovoVTydnu(t) < ukoly().length) return t;
    return stav.tydny - 1;
  }

  function odkazyTydne() {                              // { prezentace: [url…], dialog: […], tony: […], quizlet: […], lekce }
    var o = (stav.odkazy || [])[tyden], v = { prezentace: [], dialog: [], tony: [], quizlet: [] };
    if (!o || typeof o !== 'object') return v;
    ['prezentace', 'dialog', 'tony', 'quizlet'].forEach(function (k) {
      var x = o[k];
      v[k] = Array.isArray(x) ? x.filter(Boolean) : (x ? [x] : []);
    });
    v.lekce = o.lekce;
    v.znaky = Array.isArray(o.znaky) ? o.znaky : [];   // znaky lekce na psaní (skript PSANI_ZNAKU.bat)
    return v;
  }

  function druhOdkazu(aktivita) {                      // ke kterému úkolu patří který odkaz
    var t = String(aktivita).toLowerCase();
    if (t.indexOf('tóny') >= 0) return 'tony';
    if (t.indexOf('dialog') >= 0) return 'dialog';
    if (t.indexOf('prezentace') >= 0) return 'prezentace';
    if (t.indexOf('quizlet') >= 0) return 'quizlet';
    return '';
  }

  var ANKI_ODKAZ = 'https://ankiweb.net/decks';      // Anki v prohlížeči – student musí být přihlášený
  // Android: otevře aplikaci AnkiDroid (když ji nemá, AnkiWeb); iPhone a počítač: AnkiWeb v prohlížeči.
  // AnkiDroid z webu dovolí otevřít jen prohlížeč kartiček (anki://x-callback-url/browser) –
  // šipkou zpět se student dostane na seznam balíčků.
  function ankiOdkaz() {
    if (/android/i.test(navigator.userAgent)) {
      return 'intent://x-callback-url/browser#Intent;scheme=anki;package=com.ichi2.anki;' +
             'S.browser_fallback_url=' + encodeURIComponent(ANKI_ODKAZ) + ';end';
    }
    return ANKI_ODKAZ;
  }
  var BARVY_TYDNU = ['#2f4a82'];                       // jedna klidná barva pro vybraný týden a cestu
  var SVETLE_TYDNU = ['#e6e9f2'];
  var BARVY_DNU = ['#f3f6f8'];                          // všechna záhlaví dnů stejně jemně šedá

  function el(tag, trida, text) { var e = document.createElement(tag); if (trida) e.className = trida; if (text !== undefined) e.textContent = text; return e; }

  function ikonaKdy(kdy) {
    var k = String(kdy).toLowerCase();
    if (k.indexOf('ráno') >= 0) return '☀️';
    if (k.indexOf('večer') >= 0) return '🌙';
    if (k.indexOf('hodin') >= 0) return '🏫';
    return '•';
  }
  function ikonaAktivity(akt) {
    var a = String(akt).toLowerCase();
    if (a.indexOf('tóny') >= 0) return '🎧';

  function cisloDne(text) {                     // „Den hodiny“ = 0, „3. den (lehký)“ = 3

  var cekajici = {};               // odškrtnutí udělaná během načítání stavu (klíč „řádek|týden“)

  // Adresa skriptu studenta: odkaz ve tvaru …/plan-opakovani/?id=AKfycb…  (ID z URL webové aplikace)
