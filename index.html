<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plán opakování</title>
<style>
  :root {
    --bg: #f3f4f8; --karta: #ffffff; --text: #232a3d; --slaby: #737b8c;
    --akcent: #1c2a4d; --hotovo: #2fa37a; --cara: #e3e6ee; --tyden: #2a3150; --tyden-svetla: #e6e9f2;
    --hlava: linear-gradient(100deg, #0d1b3a 0%, #17305f 55%, #0a1226 100%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .pozdrav { font-size: 14px; color: var(--slaby); margin: 0; }
  h1 { font-size: 26px; margin: 2px 0 2px; letter-spacing: -.01em; }
  .podtitul { color: var(--slaby); font-size: 14px; margin: 0 0 14px; }
  .odkazy { display: flex; gap: 8px; margin: 0 0 14px; }
  .odkazy:empty { display: none; }
  .odkazy a { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
              text-decoration: none; padding: 9px 2px 8px; border-radius: 14px; background: var(--karta);
              color: var(--text); font-weight: 700; font-size: 13px; white-space: nowrap;
              box-shadow: 0 1px 3px rgba(30,50,60,.12); }
  .odkazy a b { font-size: 20px; line-height: 1.1; }
  .tydny { display: flex; gap: 6px; margin-bottom: 14px; }
  .tydny button { flex: 1; padding: 9px 0 7px; border: 0; border-radius: 14px; font: inherit;
                  font-weight: 700; font-size: 14px; cursor: pointer; color: var(--text); background: #e6e8ee; }
  .tydny button.vybrany { background: var(--tyden); border-color: var(--tyden); color: #fff;
                          box-shadow: 0 3px 8px rgba(30,50,60,.18); }
  .tydny button small { display: block; font-weight: 500; font-size: 11px; opacity: .95; }
  .cesta { padding: 2px 4px 0; margin-bottom: 14px; }
  .cesta-hlava { display: flex; justify-content: space-between; font-size: 12px; color: var(--slaby); margin-bottom: 6px; }
  .cesta-hlava b { color: var(--text); }
  .zastavky { position: relative; display: flex; justify-content: space-between; }
  .zastavky::before { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 2px;
                      background: #d3dde3; border-radius: 1px; }
  .zastavky .ujeto { position: absolute; left: 7px; top: 6px; height: 2px; border-radius: 1px;
                     background: var(--tyden); transition: width .4s; }
  .zastavka { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
              color: var(--slaby); width: 14px; }
  .zastavka i { font-style: normal; width: 14px; height: 14px; border-radius: 50%; display: block;
                background: var(--bg); border: 2px solid #c9d4da; }
  .zastavka span { font-size: 10px; line-height: 1.2; }
  .zastavka.hotova i { background: var(--tyden); border-color: var(--tyden); }
  .zastavka.dnes i { border-color: var(--akcent); background: var(--karta); }
  .zastavka.dnes { color: var(--akcent); font-weight: 700; }
  .zastavka.zvolno i { border-style: dashed; }
  .karta-dne { background: var(--karta); border-radius: 18px; margin-bottom: 14px; overflow: hidden;
               box-shadow: 0 1px 3px rgba(30,50,60,.10); }
  .karta-dne.dnes { box-shadow: 0 0 0 2px var(--akcent), 0 4px 14px rgba(30,50,60,.12); }
  .hlava-dne { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
               font-weight: 800; font-size: 17px; background: var(--hlava); color: #fff; }
  .hlava-dne .stitek { font-size: 12px; font-weight: 700; background: #f4b942; color: #1c2a4d;
                       border-radius: 999px; padding: 3px 10px; }
  .hlava-dne .hotovo-dne { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
  .ukol { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none;
          padding: 12px 14px; border: 0; border-top: 1px solid var(--cara); font: inherit; color: var(--text); cursor: pointer; }
  .ukol .ikona { flex: none; font-size: 20px; width: 26px; text-align: center; }
  .ukol .text { flex: 1; min-width: 0; }
  .ukol .kdy { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px;
               margin-bottom: 2px; background: #eef1f3; color: var(--slaby); text-transform: uppercase; letter-spacing: .04em; }
  .ukol .kdy.rano { background: #fdeab3; color: #8a5a00; }
  .ukol .kdy.vecer { background: #e4e6f2; color: #474e78; }
  .ukol .nazev { font-weight: 600; }
  .ukol .cas { flex: none; font-size: 13px; color: var(--slaby); }
  .ukol .policko { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c5d0d6;
                   display: grid; place-items: center; font-size: 17px; color: #fff; }
  .ukol.hotovo .nazev { color: var(--slaby); }
  .ukol.hotovo .policko { background: var(--hotovo); border-color: var(--hotovo); animation: fajfka .35s ease-out; }
  .ukol.hotovo .policko::after { content: "✓"; }
  @keyframes fajfka { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .otevrit { display: block; text-align: right; text-decoration: none; font-size: 13px; font-weight: 700;
             color: var(--text); padding: 0 14px 10px; margin-top: -4px; }
  .volno { padding: 14px; color: var(--slaby); font-size: 15px; border-top: 1px solid var(--cara); }
  .zprava { padding: 12px 14px; border-radius: 12px; background: #fdecec; color: #8a2525;
            font-size: 14px; margin-bottom: 12px; display: none; }
  .nacitani { color: var(--slaby); padding: 24px 0; text-align: center; }
  .tip { font-size: 13px; color: var(--slaby); margin-top: 6px; text-align: center; }
  #platno { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .pop { position: fixed; z-index: 60; pointer-events: none; font-size: 44px; transform: translate(-50%, -50%);
         animation: pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.3); }
                   25% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); }
                   100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
  .banner { position: fixed; left: 50%; top: 38%; z-index: 61; pointer-events: none; transform: translate(-50%, -50%);
            background: var(--karta); border-radius: 16px; padding: 16px 22px; font-size: 20px; font-weight: 700;
            box-shadow: 0 8px 30px rgba(0,0,0,.18); text-align: center; animation: banner 2.4s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.8); }
                      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
                      80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -55%); } }
</style>
</head>
<body>
<main>
  <canvas id="platno"></canvas>
  <p class="pozdrav" id="pozdrav"></p>
  <h1>Plán opakování</h1>
  <p class="podtitul">Ťukni na úkol, když ho máš hotový.</p>
  <div class="zprava" id="zprava"></div>
  <div class="odkazy" id="odkazy"></div>
  <div class="tydny" id="tydny"></div>
  <div class="cesta" id="cesta" style="display:none"></div>
  <div id="seznam"><div class="nacitani">Načítám…</div></div>
  <p class="tip" id="dokChyba" style="display:none"></p>
  <p class="tip">Nestihneš-li někdy všechno, udělej aspoň Anki.</p>
</main>

<script>
  var stav = null;
  var tyden = null;
  var KLIC = 'planOpakovani.tyden';

  function ulozTyden(t) { try { localStorage.setItem(KLIC, String(t)); } catch (e) {} }
  function nactiTyden() { try { var v = localStorage.getItem(KLIC); return v === null ? null : Number(v); } catch (e) { return null; } }

  function ukaz(text) {
    var z = document.getElementById('zprava');
    z.textContent = text; z.style.display = text ? 'block' : 'none';
  }

  function ukoly() { return stav.radky.filter(function (r) { return !r.volno; }); }

  function hotovoVTydnu(t) {
    return ukoly().filter(function (r) { return r.hotovo[t]; }).length;
  }

  function vychoziTyden() {
    if (stav.tyden !== null && stav.tyden !== undefined) return stav.tyden;   // podle data z tabulky
    var ulozeny = nactiTyden();
    if (ulozeny !== null && ulozeny >= 0 && ulozeny < stav.tydny) return ulozeny;
    for (var t = 0; t < stav.tydny; t++) if (hotovoVTydnu(t) < ukoly().length) return t;
    return stav.tydny - 1;
  }

  function odkazyTydne() {                              // { prezentace: [url…], dialog: […], tony: […], quizlet: […], lekce }
    var o = (stav.odkazy || [])[tyden], v = { prezentace: [], dialog: [], tony: [], quizlet: [] };
    if (!o || typeof o !== 'object') return v;
    ['prezentace', 'dialog', 'tony', 'quizlet'].forEach(function (k) {
      var x = o[k];
      v[k] = Array.isArray(x) ? x.filter(Boolean) : (x ? [x] : []);
    });
    v.lekce = o.lekce;
    v.znaky = Array.isArray(o.znaky) ? o.znaky : [];   // znaky lekce na psaní (skript PSANI_ZNAKU.bat)
    return v;
  }

  function druhOdkazu(aktivita) {                      // ke kterému úkolu patří který odkaz
    var t = String(aktivita).toLowerCase();
    if (t.indexOf('tóny') >= 0) return 'tony';
    if (t.indexOf('dialog') >= 0) return 'dialog';
    if (t.indexOf('prezentace') >= 0) return 'prezentace';
    if (t.indexOf('quizlet') >= 0) return 'quizlet';
    return '';
  }

  var ANKI_ODKAZ = 'https://ankiweb.net/decks';      // Anki v prohlížeči – student musí být přihlášený
  // Android: otevře aplikaci AnkiDroid (když ji nemá, AnkiWeb); iPhone a počítač: AnkiWeb v prohlížeči.
  // AnkiDroid z webu dovolí otevřít jen prohlížeč kartiček (anki://x-callback-url/browser) –
  // šipkou zpět se student dostane na seznam balíčků.
  function ankiOdkaz() {
    if (/android/i.test(navigator.userAgent)) {
      return 'intent://x-callback-url/browser#Intent;scheme=anki;package=com.ichi2.anki;' +
             'S.browser_fallback_url=' + encodeURIComponent(ANKI_ODKAZ) + ';end';
    }
    return ANKI_ODKAZ;
  }
  var BARVY_TYDNU = ['#2a3150'];                       // jedna klidná barva pro vybraný týden a cestu
  var SVETLE_TYDNU = ['#e6e9f2'];
  var BARVY_DNU = ['#f3f6f8'];                          // všechna záhlaví dnů stejně jemně šedá

  function el(tag, trida, text) { var e = document.createElement(tag); if (trida) e.className = trida; if (text !== undefined) e.textContent = text; return e; }

  function ikonaKdy(kdy) {
    var k = String(kdy).toLowerCase();
    if (k.indexOf('ráno') >= 0) return '☀️';
    if (k.indexOf('večer') >= 0) return '🌙';
    if (k.indexOf('hodin') >= 0) return '🏫';
    return '•';
  }
  function ikonaAktivity(akt) {
    var a = String(akt).toLowerCase();
    if (a.indexOf('tóny') >= 0) return '🎧';
    if (a.indexOf('dialog') >= 0) return '💬';
    if (a.indexOf('prezentace') >= 0) return '📖';
    if (a.indexOf('anki') >= 0) return '🧠';
    if (a.indexOf('quizlet') >= 0) return '🃏';
    if (a.indexOf('psaní') >= 0) return '✍️';
    if (a.indexOf('vět') >= 0) return '📝';
    return '⭐';
  }

  function dny() {                                     // skupiny řádků podle dne, v pořadí z tabulky
    var vys = [], mapa = {};
    stav.radky.forEach(function (r) {
      if (!mapa[r.den]) { mapa[r.den] = { den: r.den, radky: [] }; vys.push(mapa[r.den]); }
      mapa[r.den].radky.push(r);
    });
    return vys;
  }

  function zkratkaDne(text) { var c = cisloDne(text); return c === null ? '•' : (c === 0 ? 'H' : String(c)); }

  function vykresli() {
    var barva = BARVY_TYDNU[tyden % BARVY_TYDNU.length];
    document.documentElement.style.setProperty('--tyden', barva);
    document.documentElement.style.setProperty('--tyden-svetla', SVETLE_TYDNU[tyden % SVETLE_TYDNU.length]);
    var hod = new Date().getHours();
    document.getElementById('pozdrav').textContent = hod < 11 ? 'Dobré ráno! 🌟 Skvělý start do dne.' :
      (hod < 18 ? 'Hezký den! 🌤️' : 'Hezký večer! 🌙');

    var od = odkazyTydne();
    var dc = document.getElementById('dokChyba');
    dc.style.display = stav.dokChyba ? 'block' : 'none';
    dc.textContent = stav.dokChyba ? 'Odkazy z dokumentu se nepodařilo načíst: ' + stav.dokChyba : '';
    var ob = document.getElementById('odkazy');
    ob.innerHTML = '';
    [['prezentace', '📖', 'Prezentace'], ['dialog', '💬', 'Dialog'], ['tony', '🎧', 'Tóny'], ['quizlet', '🃏', 'Quizlet']].forEach(function (p) {
      od[p[0]].forEach(function (u, i, vse) {
      var a = el('a', ''); a.href = u; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('b', '', p[1])); a.appendChild(el('span', '', p[2] + (vse.length > 1 ? ' ' + (i + 1) : '')));
      ob.appendChild(a);
      });
    });

    var celkem = ukoly().length;
    var tl = document.getElementById('tydny');
    tl.innerHTML = '';
    for (var t = 0; t < stav.tydny; t++) {
      var b = el('button', t === tyden ? 'vybrany' : '');
      b.innerHTML = (t + 1) + '. týden<small>' + (t === stav.tyden ? 'teď · ' : '') + hotovoVTydnu(t) + '/' + celkem + '</small>';
      b.onclick = (function (tt) { return function () { tyden = tt; vybralSam = true; ulozTyden(tt); vykresli(); }; })(t);
      tl.appendChild(b);
    }

    // cesta týdnem: zastávka za každý den
    var skupiny = dny();
    var cesta = document.getElementById('cesta');
    cesta.style.display = 'block';
    cesta.innerHTML = '';
    var h = hotovoVTydnu(tyden);
    var hl = el('div', 'cesta-hlava');
    hl.innerHTML = '<span>Cesta ' + (tyden + 1) + '. týdnem' + (od.lekce ? ' · lekce ' + od.lekce : '') +
      '</span><span>Hotovo <b>' + h + ' z ' + celkem + '</b>' +
      (h === celkem && celkem ? ' 🏆' : '') + '</span>';
    cesta.appendChild(hl);
    var zast = el('div', 'zastavky');
    var ujeto = el('div', 'ujeto'); zast.appendChild(ujeto);
    var posledniHotova = -1;
    skupiny.forEach(function (g, i) {
      var uk = g.radky.filter(function (r) { return !r.volno; });
      var volno = !uk.length;
      var hotova = !volno && uk.every(function (r) { return r.hotovo[tyden]; });
      if (hotova || (volno && posledniHotova === i - 1)) posledniHotova = i;
      var z = el('div', 'zastavka' + (hotova ? ' hotova' : '') + (volno ? ' zvolno' : '') + (jeDnes(g.den) ? ' dnes' : ''));
      var kr = el('i', '');
      z.appendChild(kr); z.appendChild(el('span', '', zkratkaDne(g.den)));
      zast.appendChild(z);
    });
    cesta.appendChild(zast);
    var n = skupiny.length;
    requestAnimationFrame(function () {
      var sirka = zast.clientWidth - 14;
      ujeto.style.width = (n > 1 && posledniHotova > 0 ? sirka * posledniHotova / (n - 1) : 0) + 'px';
    });

    // karty dnů
    var s = document.getElementById('seznam');
    s.innerHTML = '';
    skupiny.forEach(function (g, i) {
      var dnes = jeDnes(g.den);
      var karta = el('div', 'karta-dne' + (dnes ? ' dnes' : ''));
      var hlava = el('div', 'hlava-dne');
      // barvu zahlavi dne dava styl (.hlava-dne, --hlava)
      hlava.appendChild(el('span', '', g.den));
      var uk = g.radky.filter(function (r) { return !r.volno; });
      if (dnes) hlava.appendChild(el('span', 'stitek', 'dnes'));
      else if (uk.length) hlava.appendChild(el('span', 'hotovo-dne',
        uk.filter(function (r) { return r.hotovo[tyden]; }).length + '/' + uk.length));
      karta.appendChild(hlava);
      g.radky.forEach(function (r) {
        if (r.volno) { karta.appendChild(el('div', 'volno', '💤 Volno – dnes žádná čínština.')); return; }
        var b = el('button', 'ukol' + (r.hotovo[tyden] ? ' hotovo' : ''));
        b.appendChild(el('span', 'ikona', ikonaAktivity(r.aktivita)));
        var txt = el('span', 'text');
        var k = String(r.kdy).toLowerCase();
        txt.appendChild(el('span', 'kdy' + (k.indexOf('ráno') >= 0 ? ' rano' : (k.indexOf('večer') >= 0 ? ' vecer' : '')), r.kdy));
        txt.appendChild(el('div', 'nazev', r.aktivita));
        b.appendChild(txt);
        b.appendChild(el('span', 'cas', r.cas));
        b.appendChild(el('span', 'policko'));
        b.onclick = function () { prepni(r, b); };
        karta.appendChild(b);
        var druh = druhOdkazu(r.aktivita);
        if (druh) od[druh].forEach(function (u, i, vse) {
          var a = el('a', 'otevrit', 'Otevřít ' + { prezentace: 'prezentaci', dialog: 'dialog', tony: 'tóny', quizlet: 'Quizlet' }[druh] +
                      (vse.length > 1 ? ' ' + (i + 1) : '') + ' ▸');
          a.href = u; a.target = '_blank'; a.rel = 'noopener';
          karta.appendChild(a);
        });
        if (/anki/i.test(r.aktivita)) {                         // Anki ve webovém prohlížeči (AnkiWeb)
          var aa = el('a', 'otevrit', 'Otevřít Anki ▸');
          aa.href = ankiOdkaz(); aa.target = '_blank'; aa.rel = 'noopener';
          karta.appendChild(aa);
        }
        if (/psaní|znak/i.test(r.aktivita) && od.znaky.length) {   // animace znaků lekce
          var az = el('a', 'otevrit', 'Otevřít animace znaků ▸');
          az.href = 'znaky.html?l=' + encodeURIComponent(od.lekce || '') +
                    '&d=' + encodeURIComponent(JSON.stringify(od.znaky));
          az.target = '_blank'; az.rel = 'noopener';
          karta.appendChild(az);
        }
      });
      s.appendChild(karta);
    });
  }

  function cisloDne(text) {                     // „Den hodiny“ = 0, „3. den (lehký)“ = 3
    if (/^den hodiny/i.test(text)) return 0;
    var m = /^(\d+)\./.exec(text);
    return m ? Number(m[1]) : null;
  }

  function jeDnes(text) {
    if (stav.den === null || stav.den === undefined || tyden !== stav.tyden) return false;
    var c = cisloDne(text);
    if (c === null) return false;
    return c === stav.den;
  }

  var cekajici = {};               // odškrtnutí udělaná během načítání stavu (klíč „řádek|týden“)
  var nacitam = false;
  var vybralSam = false;           // student si sám přepnul týden, zatímco se načítalo

  function ulozCache() { try { localStorage.setItem(KLIC_STAV, JSON.stringify(stav)); } catch (e) {} }
  function nactiCache() { try { var v = localStorage.getItem(KLIC_STAV); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  /* ---------- Oslavy: animace a zvuky (bez souborů navíc) ---------- */
  var zvukZap = true;               // zvuk jen u potlesku
  var malyPohyb = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ac = null;
  function audio() {
    if (!zvukZap) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tony(seznam, typ, hlasitost) {          // seznam: [frekvence, začátek s, délka s]
    var a = audio(); if (!a) return;
    var t0 = a.currentTime + .02;
    seznam.forEach(function (n) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = typ || 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0, t0 + n[1]);
      g.gain.linearRampToValueAtTime(hlasitost || .2, t0 + n[1] + .01);
      g.gain.exponentialRampToValueAtTime(.001, t0 + n[1] + n[2]);
      o.connect(g); g.connect(a.destination);
      o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + .05);
    });
  }
  function sum(zacatek, delka, hlasitost, frekv) {   // krátký šum: tlesknutí / prasknutí rachejtle
    var a = audio(); if (!a) return;
    var n = Math.floor(a.sampleRate * delka), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = frekv || 1500; f.Q.value = .8; g.gain.value = hlasitost;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(a.currentTime + zacatek);
  }
  function zvukCink() { var z = [[1047, 0, .25], [1568, .08, .35]]; tony(z, 'sine', .18); }
  function zvukPotlesk(delka) {
    for (var i = 0; i < delka * 18; i++) sum(Math.random() * delka, .06, .25 + Math.random() * .25, 1200 + Math.random() * 1400);
  }
  function zvukFanfara() {
    tony([[523, 0, .18], [659, .15, .18], [784, .3, .18], [1047, .45, .6]], 'triangle', .22);
    tony([[262, .45, .6], [392, .45, .6]], 'sine', .12);
  }
  function zvukOhnostroj() {
    for (var i = 0; i < 6; i++) { var t = .2 + i * .35 + Math.random() * .15; sum(t, .5, .5, 300 + Math.random() * 500); }
  }

  var platno = document.getElementById('platno'), cx = platno.getContext('2d'), castice = [], bezi = false;
  function velikost() { var r = window.devicePixelRatio || 1; platno.width = innerWidth * r; platno.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); }
  velikost(); addEventListener('resize', velikost);
  var BARVY = ['#b23a3a', '#e8a33d', '#2f7d4f', '#3b6fb6', '#8c4fb3', '#e86f9c', '#f2d13d'];
  function pridej(x, y, pocet, sila, tvar) {
    for (var i = 0; i < pocet; i++) {
      var uhel = Math.random() * Math.PI * 2, v = sila * (.4 + Math.random() * .8);
      castice.push({ x: x, y: y, vx: Math.cos(uhel) * v, vy: Math.sin(uhel) * v - (tvar === 'jiskra' ? 0 : sila * .6),
                     zivot: 1, ubytek: .008 + Math.random() * .012, barva: BARVY[i % BARVY.length],
                     vel: tvar === 'jiskra' ? 2.5 : 5 + Math.random() * 5, rot: Math.random() * 6, tvar: tvar });
    }
    if (!bezi) { bezi = true; requestAnimationFrame(krok); }
  }
  function krok() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    castice = castice.filter(function (c) { return c.zivot > 0 && c.y < innerHeight + 40; });
    castice.forEach(function (c) {
      c.vy += c.tvar === 'jiskra' ? .05 : .18; c.vx *= .99; c.x += c.vx; c.y += c.vy; c.zivot -= c.ubytek; c.rot += .15;
      cx.globalAlpha = Math.max(c.zivot, 0); cx.fillStyle = c.barva;
      if (c.tvar === 'jiskra') { cx.beginPath(); cx.arc(c.x, c.y, c.vel, 0, 7); cx.fill(); }
      else { cx.save(); cx.translate(c.x, c.y); cx.rotate(c.rot); cx.fillRect(-c.vel / 2, -c.vel / 4, c.vel, c.vel / 2); cx.restore(); }
    });
    cx.globalAlpha = 1;
    if (castice.length) requestAnimationFrame(krok); else bezi = false;
  }
  function emoji(znak, x, y) {
    var e = document.createElement('div'); e.className = 'pop'; e.textContent = znak;
    e.style.left = x + 'px'; e.style.top = y + 'px';
    document.body.appendChild(e); setTimeout(function () { e.remove(); }, 1200);
  }
  function banner(text) {
    var e = document.createElement('div'); e.className = 'banner'; e.textContent = text;
    document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2500);
  }
  function ohnostroj() {
    for (var i = 0; i < 6; i++) (function (i) {
      setTimeout(function () { pridej(innerWidth * (.2 + Math.random() * .6), innerHeight * (.15 + Math.random() * .35), 70, 6, 'jiskra'); }, i * 350);
    })(i);
  }

  function oslav(r, t, prvek) {
    var box = prvek.getBoundingClientRect(), x = box.left + 40, y = box.top + box.height / 2;
    var ukolyTydne = ukoly(), hotovoTyden = ukolyTydne.every(function (u) { return u.hotovo[t]; });
    var dne = ukolyTydne.filter(function (u) { return u.den === r.den; });
    var hotovoDen = dne.length > 1 && dne.every(function (u) { return u.hotovo[t]; });
    if (hotovoTyden) {
      banner('🏆 Celý týden hotový!'); zvukPotlesk(2);
      if (!malyPohyb) ohnostroj();
    } else if (hotovoDen) {
      banner('🎉 ' + r.den.replace(/\s*\(.*\)/, '') + ' splněný!'); zvukPotlesk(1.4); emoji('👏', x, y);
      if (!malyPohyb) { pridej(innerWidth * .25, innerHeight * .35, 60, 9); pridej(innerWidth * .75, innerHeight * .35, 60, 9); }
    } else {
      var volba = Math.floor(Math.random() * 4);
      if (volba === 0 && !malyPohyb) pridej(x, y, 35, 7);
      else if (volba === 1) { emoji('👏', x, y); zvukPotlesk(.5); }
      else emoji(['🎉', '⭐', '💪', '🌟', '🥳', '🔥'][Math.floor(Math.random() * 6)], x, y);
    }
  }

  function prepni(r, b) {
    var t = tyden;
    var nova = !r.hotovo[t];
    var klic = r.radek + '|' + t;
    r.hotovo[t] = nova;
    if (nova) oslav(r, t, b);
    if (nacitam) cekajici[klic] = nova;
    vykresli();
    ulozCache();
    ukaz('');
    api({ akce: 'nastav', radek: r.radek, tyden: t, hodnota: nova ? 1 : 0 })
      .catch(function () {
        delete cekajici[klic];
        r.hotovo[t] = !nova;
        vykresli();
        ulozCache();
        ukaz('Nepodařilo se uložit. Zkontroluj připojení k internetu a ťukni znovu.');
      });
  }

  // Adresa skriptu studenta: odkaz ve tvaru …/plan-opakovani/?id=AKfycb…  (ID z URL webové aplikace)
  var ID = new URLSearchParams(location.search).get('id') || '';
  var API = 'https://script.google.com/macros/s/' + encodeURIComponent(ID) + '/exec';
  KLIC = 'planOpakovani.tyden.' + ID;
  var KLIC_STAV = 'planOpakovani.stav.' + ID;

  function api(param) {
    var q = Object.keys(param).map(function (k) { return k + '=' + encodeURIComponent(param[k]); }).join('&');
    return fetch(API + '?' + q, { method: 'GET', credentials: 'omit', cache: 'no-store' })
      .then(function (odp) { if (!odp.ok) throw new Error('HTTP ' + odp.status); return odp.json(); })
      .then(function (data) { if (data && data.chyba) throw new Error(data.chyba); return data; });
  }

  function start() {
    if (!ID) {
      document.getElementById('seznam').innerHTML = '';
      ukaz('V odkazu chybí kód studenta (…/?id=…). Požádej lektorku o celý odkaz.');
      return;
    }
    // 1) hned ukázat stav z minula (uložený v telefonu), 2) na pozadí načíst aktuální z tabulky
    var zMinula = nactiCache();
    if (zMinula && zMinula.radky && zMinula.radky.length) {
      stav = zMinula;
      tyden = vychoziTyden();
      vykresli();
      var ch = document.querySelector('.cesta-hlava span'); if (ch) ch.textContent += ' · aktualizuji…';
    }
    nacitam = true;
    api({ akce: 'stav' })
      .then(function (data) {
        nacitam = false;
        Object.keys(cekajici).forEach(function (k) {          // odškrtnutí z doby načítání nepřepsat
          var c = k.split('|');
          data.radky.forEach(function (r) { if (r.radek === Number(c[0])) r.hotovo[Number(c[1])] = cekajici[k]; });
        });
        cekajici = {};
        var byloZobrazeno = !!stav;
        stav = data;
        ulozCache();
        if (!stav.radky.length) {
          document.getElementById('seznam').innerHTML = '<div class="nacitani">V plánu nejsou žádné aktivity.</div>';
          return;
        }
        if (!byloZobrazeno || !vybralSam) tyden = vychoziTyden();
        vykresli();
      })
      .catch(function () {
        nacitam = false; cekajici = {};
        if (stav) { ukaz('Nepodařilo se načíst aktuální stav – zobrazuji uložený. Zkontroluj připojení.'); return; }
        document.getElementById('seznam').innerHTML = '';
        ukaz('Plán se nepodařilo načíst. Zkontroluj připojení a obnov stránku.');
      });
  }
  start();
</script>
